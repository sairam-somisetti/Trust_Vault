services:
  - type: web
    name: trustvault
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
